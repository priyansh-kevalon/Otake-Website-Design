services:
  - type: web
    name: otake-backend
    env: node
    plan: free
    buildCommand: cd otake-backend && npm install && npm run build
    startCommand: cd otake-backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: ALLOW_ORIGINS
        sync: false

  - type: web
    name: otake-frontend
    env: static
    plan: free
    buildCommand: cd Otake-Frontend && npm install && npm run build
    staticPublishPath: Otake-Frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false

  - type: web
    name: otake-admin
    env: static
    plan: free
    buildCommand: cd otake-admin && npm install && npm run build
    staticPublishPath: otake-admin/dist
    envVars:
      - key: VITE_API_URL
        sync: false
